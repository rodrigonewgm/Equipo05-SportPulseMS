server:
  port: 8086
  error:
    include-message: always

spring:
  application:
    name: ms-standings

rapidapi:
  key: ${RAPIDAPI_KEY:your-key-here}
  host: v3.football.api-sports.io
  base-url: https://v3.football.api-sports.io

jwt:
  secret: ${JWT_SECRET:sportpulse-secret-key-2025-development-only}

services:
  teams-url: ${TEAMS_SERVICE_URL:http://localhost:8083}
teams:
  service:
    url: ${TEAMS_SERVICE_URL:localhost:8083}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sportpulse: DEBUG

