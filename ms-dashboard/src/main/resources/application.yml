server:
  port: 8089

spring:
  application:
    name: ms-dashboard

jwt:
  secret: ${JWT_SECRET:sportpulse-secret-key-2025-development-only}

rapidapi:
  key: ${RAPIDAPI_KEY:your-key-here}
  host: v3.football.api-sports.io
  base-url: https://v3.football.api-sports.io

services:
  fixtures-url: ${FIXTURES_SERVICE_URL:http://localhost:8085}
  standings-url: ${STANDINGS_SERVICE_URL:http://localhost:8086}
  leagues-url: ${LEAGUES_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sportpulse: DEBUG