server:
  port: 8085

spring:
  application:
    name: ms-fixtures

rapidapi:
  key: ${RAPIDAPI_KEY:your-rapidapi-key-here}
  host: api-football-v1.p.rapidapi.com
  base-url: https://api-football-v1.p.rapidapi.com/v3

jwt:
  secret: ${JWT_SECRET:sportpulse-secret-key-2025-development-only}

services:
  teams-url: ${TEAMS_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sportpulse: DEBUG
