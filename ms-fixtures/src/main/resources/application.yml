server:
  port: 8085

spring:
  application:
    name: ms-fixtures

rapidapi:
  key: ${RAPIDAPI_KEY:tu-api-key}
  host: v3.football.api-sports.io
  base-url: https://v3.football.api-sports.io

jwt:
  secret: ${JWT_SECRET:sportpulse-secret-key-2025-development-only}

services:
  teams-url: ${TEAMS_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sportpulse: DEBUG
