server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      routes:
        - id: ms-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: ms-leagues
          uri: ${LEAGUES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/leagues/**

        - id: ms-teams
          uri: ${TEAMS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/teams/**

        - id: ms-fixtures
          uri: ${FIXTURES_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/fixtures/**

        - id: ms-standings
          uri: ${STANDINGS_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/standings/**

        - id: ms-notifications
          uri: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/notifications/**

        - id: ms-dashboard
          uri: ${DASHBOARD_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/dashboard/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

rate-limiting:
  requests-per-minute: 60

logging:
  level:
    org.springframework.cloud.gateway: INFO
