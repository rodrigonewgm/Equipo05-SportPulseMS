server:
  port: 8083

spring:
  application:
    name: ms-teams

rapidapi:
  key: ${RAPIDAPI_KEY:your-api-key}
  host: v3.football.api-sports.io
  base-url: https://v3.football.api-sports.io

jwt:
  secret: ${JWT_SECRET:sportpulse-secret-key-2025-development-only}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sportpulse: DEBUG
